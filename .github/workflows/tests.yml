name: Package checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[experiments,dev]"
      - run: python -m pytest
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - name: Smoke test installed wheel outside checkout
        run: |
          cd "$(mktemp -d)"
          python -c "from intervalbasedtsml.classification import PULSARClassifier, FITClassifier; from intervalbasedtsml.regression import PULSARRegressor"
